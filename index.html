<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空色生成 — 일본 전통색 하늘 생성기</title>
<meta name="description" content="일본 전통색 200가지로 하늘 그라데이션을 만드는 생성기. 색을 고르고, 층을 쌓고, 고화질 PNG로 저장하세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="空色生成 — 일본 전통색 하늘 그라데이션 생성기">
<meta property="og:description" content="전통색 200 · 구조 7 · 프리셋 67 · PNG 3600px">
<meta property="og:url" content="https://gigabgim59-sketch.github.io/sky/">
<meta property="og:image" content="https://gigabgim59-sketch.github.io/sky/sky-thumbnail.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://gigabgim59-sketch.github.io/sky/sky-thumbnail.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e6e6e1; --panel:#f3f3ef; --ink:#1d1d1f; --sub:#6c6b67; --line:#d0cfc8;
  --chip:#ebebe6; --accent:#165e83; --accent-ink:#ffffff; --shadow:rgba(20,20,30,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16171a; --panel:#202125; --ink:#ecebe7; --sub:#9c9a95; --line:#34353b;
    --chip:#292a2f; --accent:#59b9c6; --accent-ink:#0b1a1c; --shadow:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#16171a; --panel:#202125; --ink:#ecebe7; --sub:#9c9a95; --line:#34353b;
  --chip:#292a2f; --accent:#59b9c6; --accent-ink:#0b1a1c; --shadow:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Apple SD Gothic Neo","Noto Sans JP",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;
}
button{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(14px,3vw,36px)}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:"Shippori Mincho",serif;font-weight:700;font-size:clamp(26px,4.4vw,40px);letter-spacing:.1em;margin:0;line-height:1.1}
.sub{margin:0;color:var(--sub);font-size:13px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:28px;align-items:start}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.canvas-box{display:flex;justify-content:center}
#cv{display:block;max-width:100%;max-height:calc(100vh - 170px);width:auto;height:auto;
  box-shadow:0 22px 50px -28px var(--shadow),0 1px 0 rgba(0,0,0,.05)}
.namebar{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.nm{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border:1px solid var(--line);
  background:var(--panel);border-radius:999px;cursor:pointer;font-family:"Shippori Mincho",serif;font-size:14px}
.nm i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:block}
.nm:hover{border-color:var(--ink)}

.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.act{padding:11px 4px;border:1px solid var(--line);background:var(--bg);border-radius:9px;cursor:pointer;font-size:13px;white-space:nowrap}
.act:hover:not(:disabled){border-color:var(--ink)}
.act:disabled{opacity:.4;cursor:default}
.act.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.act.dl{grid-column:1 / -1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;font-size:14px;padding:13px}
.act.dl[aria-busy="true"]{opacity:.6}

.tabs{display:flex;gap:4px;margin:16px 0 14px;background:var(--bg);padding:4px;border-radius:10px}
.tabs button{flex:1;padding:9px 4px;border:0;background:transparent;border-radius:7px;cursor:pointer;font-size:14px;color:var(--sub)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}

h3{font-size:13px;font-weight:500;color:var(--sub);margin:18px 0 9px;letter-spacing:.02em}
h3:first-child{margin-top:2px}

.stops{display:flex;flex-direction:column;gap:8px}
.stop{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;grid-template-rows:auto auto;gap:4px 10px;align-items:center;
  padding:8px 8px 6px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.stop .sw{grid-row:1 / 3;width:44px;height:44px;border-radius:8px;border:1px solid rgba(0,0,0,.14);cursor:pointer;padding:0}
.stop .meta{min-width:0;cursor:pointer}
.stop .meta b{font-family:"Shippori Mincho",serif;font-size:16px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .meta small{color:var(--sub);font-size:11px;white-space:nowrap}
.ic{width:32px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;font-size:15px;line-height:1;padding:0}
.ic:hover:not(:disabled){border-color:var(--ink)}
.ic:disabled{opacity:.3;cursor:default}
.stop .posrow{grid-column:2 / 5;display:flex;align-items:center;gap:8px}
.stop input[type=range]{flex:1;accent-color:var(--accent);margin:0}
.stop .pct{font-size:11px;color:var(--sub);width:34px;text-align:right;font-variant-numeric:tabular-nums}

.row2{display:flex;gap:8px;margin-top:10px}
.ghost{flex:1;padding:10px;border:1px dashed var(--line);background:transparent;border-radius:9px;cursor:pointer;font-size:13px}
.ghost:hover{border-color:var(--ink)}
.ghost.small{flex:none;padding:7px 12px;margin-top:8px;border-style:solid}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border:1px solid var(--line);background:var(--chip);border-radius:999px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stepper{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--sub)}
.stepper b{color:var(--ink);font-size:16px;min-width:18px;text-align:center}

.structs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.st{display:flex;flex-direction:column;gap:5px;align-items:center;padding:6px;border:1px solid var(--line);background:var(--bg);border-radius:9px;cursor:pointer;font-size:12px}
.st span{width:100%;aspect-ratio:3/4;border-radius:5px;display:block}
.st[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#tex{width:100%;accent-color:var(--accent)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:9px;margin-top:12px}
.pt{position:relative;display:flex;flex-direction:column;gap:5px;padding:0;border:0;background:none;cursor:pointer;text-align:center}
.pt .g{aspect-ratio:3/4;border-radius:6px;border:1px solid rgba(0,0,0,.1);display:block}
.pt .t{font-family:"Shippori Mincho",serif;font-size:12px;line-height:1.25}
.pt:hover .g{outline:2px solid var(--ink);outline-offset:1px}
.pt .del{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;cursor:pointer}
.empty{color:var(--sub);font-size:13px;line-height:1.7;padding:10px 2px}

.sheet{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(10,10,14,.45)}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-height:84vh;display:flex;flex-direction:column;gap:10px;
  background:var(--panel);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
@media(min-width:861px){.sheet-card{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(760px,92vw);max-height:84vh;border-radius:16px}}
.sheet-card>*{flex:none}
.picker-card{height:82vh}
.sheet-head{display:flex;align-items:center;gap:8px}
.cur{flex:1;display:flex;align-items:center;gap:12px;min-width:0;font-size:13px;color:var(--sub);line-height:1.35}
.cur i{width:46px;height:46px;border-radius:10px;border:1px solid rgba(0,0,0,.14);flex:none}
.cur .mini{position:relative;width:42px;height:56px;border-radius:5px;border:3px solid #f8f8f5;box-shadow:0 2px 8px -3px var(--shadow);flex:none}
.cur .mini u{position:absolute;left:-7px;right:-7px;height:2px;background:var(--ink);border-radius:2px;transform:translateY(-1px)}
.cur .dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15);margin-right:6px;vertical-align:1px}
.cur b{font-family:"Shippori Mincho",serif;font-size:21px;color:var(--ink)}
.cur em{font-style:normal;font-size:13px}
.cur small{font-size:12px}
.x{width:36px;height:36px;border:1px solid var(--line);background:var(--bg);border-radius:50%;cursor:pointer;flex:none}
.done{padding:9px 18px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);cursor:pointer;font-weight:700}
.revert{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;cursor:pointer;font-size:12px;color:var(--sub)}
.near{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center;padding:1px 0}
.near::-webkit-scrollbar,.fams::-webkit-scrollbar{display:none}
.nlabel{flex:none;font-size:11px;color:var(--sub);margin-right:2px}
.nr{flex:none;display:flex;align-items:center;gap:6px;padding:4px 11px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-family:"Shippori Mincho",serif;font-size:13px}
.nr i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:block}
#q{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.fams{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px 0}
.fams .chip{flex:none;padding:6px 11px}
.fams .chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.pscroll{flex:1 1 auto!important;min-height:0;overflow-y:auto;overscroll-behavior:contain;position:relative;margin:0 -2px;padding:0 2px 10px}
.sec h4{position:sticky;top:0;z-index:1;margin:0;padding:10px 2px 7px;background:var(--panel);font-size:13px;font-weight:500;color:var(--sub);display:flex;align-items:center;gap:6px}
.sec h4 i{width:9px;height:9px;border-radius:50%;display:block}
.sec h4 span{font-size:11px;opacity:.7}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.sq{aspect-ratio:1;border-radius:9px;border:1px solid rgba(0,0,0,.12);padding:0;cursor:pointer}
.sq.on,.nt.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4.5px var(--ink)}
.named{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px}
.nt{display:flex;align-items:center;gap:8px;padding:5px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;text-align:left;min-width:0}
.nt i{width:32px;height:32px;border-radius:7px;border:1px solid rgba(0,0,0,.12);flex:none;display:block}
.nt span{min-width:0}
.nt b{font-family:"Shippori Mincho",serif;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt small{font-size:10px;color:var(--sub);white-space:nowrap}
.custom{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);border-top:1px solid var(--line);padding-top:10px}
.custom input{width:44px;height:30px;border:0;padding:0;background:none;cursor:pointer}
.imgcard img{display:block;max-width:100%;max-height:52vh;margin:0 auto;border-radius:4px;box-shadow:0 10px 30px -18px var(--shadow)}
.savebtns{display:flex;flex-direction:column;gap:8px}
.savebtns .act{padding:13px}
.hint{margin:0;font-size:12px;color:var(--sub);line-height:1.6;text-align:center}
@media(max-width:860px){
  .picker-card{height:82vh;height:82dvh}
  #picker .sheet-bg{background:rgba(10,10,14,.15)}
}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:860px){
  .main{grid-template-columns:1fr;gap:12px}
  .stage{z-index:5;background:var(--bg);padding:6px 0 10px;top:env(safe-area-inset-top,0px)}
  #cv{max-height:36vh}
  .namebar{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding:0 2px 2px;scrollbar-width:none}
  .nm{flex:none;font-size:13px}
  .side{padding:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>空色生成</h1>
    <p class="sub">일본 전통색 <span id="ncount"></span>가지로 만드는 하늘 그라데이션</p>
  </header>

  <div class="main">
    <section class="stage">
      <div class="canvas-box"><canvas id="cv" width="600" height="800"></canvas></div>
      <div class="namebar" id="namebar"></div>
    </section>

    <section class="side">
      <div class="actions">
        <button class="act primary" id="bRand">🎲 랜덤</button>
        <button class="act" id="bUndo" disabled>↶ 되돌리기</button>
        <button class="act" id="bRev">⇅ 반전</button>
        <button class="act" id="bFav">☆ 즐겨찾기</button>
        <button class="act dl" id="bSave">⤓ PNG 저장</button>
      </div>

      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="edit" aria-selected="true">색 편집</button>
        <button role="tab" data-tab="preset" aria-selected="false">프리셋</button>
        <button role="tab" data-tab="opt" aria-selected="false">구조·출력</button>
      </nav>

      <div class="tabpane" id="t-edit">
        <h3>층 (위 → 아래) · 색을 누르면 바꿀 수 있어요</h3>
        <div class="stops" id="stops"></div>
        <div class="row2">
          <button class="ghost" id="bAdd">＋ 색 추가</button>
          <button class="ghost" id="bEven">균등 배치</button>
        </div>
        <h3>랜덤 분위기</h3>
        <div class="chips" id="moods"></div>
        <div class="stepper">랜덤 층 수 <button class="ic" id="nMinus">−</button><b id="nVal">5</b><button class="ic" id="nPlus">＋</button></div>
      </div>

      <div class="tabpane" id="t-preset" hidden>
        <div class="chips" id="pgroups"></div>
        <div class="pgrid" id="plist"></div>
      </div>

      <div class="tabpane" id="t-opt" hidden>
        <h3>구조</h3>
        <div class="structs" id="structs"></div>
        <h3>질감 <span id="texV"></span></h3>
        <input type="range" id="tex" min="0" max="100" value="40">
        <button class="ghost small" id="bSeed">질감 패턴 바꾸기</button>
        <h3>비율</h3>
        <div class="chips" id="ratios"></div>
        <h3>흰 테두리</h3>
        <div class="chips" id="frames"></div>
        <h3>저장 해상도 (긴 변)</h3>
        <div class="chips" id="reses"></div>
      </div>
    </section>
  </div>
</div>

<div class="sheet" id="picker" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-card picker-card" role="dialog" aria-label="색 선택">
    <div class="sheet-head">
      <div class="cur" id="pcur"></div>
      <button class="revert" id="prevert" hidden>원래대로</button>
      <button class="done" id="pdone">완료</button>
    </div>
    <div class="near" id="near"></div>
    <input id="q" type="search" placeholder="이름·읽기·HEX 검색 (예: 藍, あお, 2792)" autocomplete="off">
    <div class="fams" id="fams"></div>
    <div class="pscroll" id="pscroll"></div>
    <label class="custom">목록에 없는 색 직접 지정 <input type="color" id="custom" value="#a0d8ef"></label>
  </div>
</div>

<div class="sheet" id="imgview" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-card imgcard" role="dialog" aria-label="이미지 저장">
    <div class="sheet-head"><div class="cur"><b>이미지 저장</b></div><button class="x" data-close aria-label="닫기">✕</button></div>
    <img id="outimg" alt="생성된 하늘 그라데이션">
    <div class="savebtns">
      <button class="act dl" id="bShare">사진에 저장 · 공유</button>
      <button class="act" id="bFile">파일로 다운로드</button>
    </div>
    <p class="hint">이미지를 길게 눌러 ‘사진 앱에 저장’을 선택해도 돼요.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

/* ---------- CSS gradient helpers (thumbnails) ---------- */
function cssStops(stops) { return stops.slice().sort((a, b) => a.p - b.p).map(o => col(o.c).h + ' ' + (o.p * 100).toFixed(1) + '%').join(','); }

function structGrad(st, stops) {
  switch (st) {
    case 'v': return 'linear-gradient(to right,' + cssStops(stops) + ')';
    case 'd': return 'linear-gradient(to bottom right,' + cssStops(stops) + ')';
    case 'r': return 'radial-gradient(circle at 50% 12%,' + cssStops(stops) + ')';
    case 'g': return 'radial-gradient(circle at 50% 55%,' + cssStops(stops) + ')';
    case 'c': return 'linear-gradient(172deg,' + cssStops(stops) + ')';
    case 'b': {
      const s = stops.slice().sort((a, b) => a.p - b.p);
      const up = s.slice().reverse().map(o => col(o.c).h + ' ' + (50 - o.p * 50).toFixed(1) + '%');
      const dn = s.map(o => col(o.c).h + ' ' + (50 + o.p * 50).toFixed(1) + '%');
      return 'linear-gradient(to bottom,' + up.concat(dn).join(',') + ')';
    }

  }
}

function randomize() {
  push(); const n = S.n, m = MOODS[S.mood]; const ids = [];
  if (S.mood === 'any') { for (let i = 0; i < n; i++) ids.push(pick(LIST).id); }
  else {
    ids.push(pick(m.top));
    for (let i = 0; i < n - 2; i++) ids.push(pick(i < (n - 2) / 2 ? m.mid : m.mid.concat(m.bot)));
    ids.push(pick(m.bot));
  }
  S.stops = ids.map((c, i) => {
    let p = i / (n - 1);
    if (i > 0 && i < n - 1) p += (Math.random() - .5) * (.6 / (n - 1));
    return { c, p: Math.min(1, Math.max(0, p)) };
  });
  renderStops(); draw();
}

function renderStructPreviews() { document.querySelectorAll('#structs .st').forEach(b => { b.querySelector('span').style.background = structGrad(b.dataset.s, S.stops); }); }
$('#structs').addEventListener('click', e => { const b = e.target.closest('.st'); if (!b) return; push(); S.struct = b.dataset.s; renderOpts(); draw(); });
$('#ratios').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; push(); S.ratio = b.dataset.r; renderOpts(); draw(); });
$('#frames').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; push(); S.frame = b.dataset.fr === 'true'; renderOpts(); draw(); });
$('#reses').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; S.res = +b.dataset.res; renderOpts(); });
let texDrag = false;
$('#tex').addEventListener('input', e => { if (!texDrag) { push(); texDrag = true; } S.tex = +e.target.value; $('#texV').textContent = S.tex + '%'; draw(); });
$('#tex').addEventListener('change', () => { texDrag = false; });
$('#bSeed').onclick = () => { S.seed = (Math.random() * 1e9) | 0; draw(); };

/* ---------- Tabs ---------- */
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  ['edit', 'preset', 'opt'].forEach(t => { $('#t-' + t).hidden = t !== b.dataset.tab; });
}));

/* ---------- Export ---------- */
let downloads = null;
(async () => { try { if (window.claude && typeof window.claude.use === 'function') downloads = await window.claude.use('downloads'); } catch (e) { downloads = null; } })();
const coarse = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);
let saveBlob = null, saveName = '', outURL = '';
async function exportPNG() {
  const btn = $('#bSave'); if (btn.getAttribute('aria-busy') === 'true') return;
  btn.setAttribute('aria-busy', 'true'); const label = btn.textContent; btn.textContent = '만드는 중…';
  await new Promise(r => setTimeout(r, 40));
  try {
    const c = document.createElement('canvas'); paint(c, S.res, S.seed);
    fieldCache.clear(); texCache.clear();
    const ss = sortedStops();
    const name = ('空色_' + ss.map(o => col(o.c).n).join('-')).replace(/[#\\/:*?"<>|]/g, '').slice(0, 120) + '.png';
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    if (downloads) {
      try { await downloads.save({ filename: name, data: blob }); toast('저장했어요'); }
      catch (err) {
        const code = err && err.code;
        if (code === 'declined') toast('저장을 취소했어요');
        else if (code === 'rate_limited') toast('잠시 후 다시 눌러 주세요');
        else openSave(blob, name, false, c);
      }
    } else if (coarse) openSave(blob, name, true, c);
    else fileDownload(blob, name);
  } finally { btn.textContent = label; btn.removeAttribute('aria-busy'); draw(); }
}
function fileDownload(blob, name) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 20000);
  toast(coarse ? '‘파일’ 앱의 다운로드 폴더에 저장돼요' : '다운로드를 시작했어요');
}
function openSave(blob, name, withButtons, canvas) {
  saveBlob = blob; saveName = name;
  if (outURL) { URL.revokeObjectURL(outURL); outURL = ''; }
  if (withButtons) { outURL = URL.createObjectURL(blob); $('#outimg').src = outURL; }
  else $('#outimg').src = canvas.toDataURL('image/png');
  let canShare = false;
  try { canShare = withButtons && !!navigator.canShare && navigator.canShare({ files: [new File([blob], name, { type: 'image/png' })] }); } catch (e) { canShare = false; }
  $('#bShare').hidden = !canShare; $('#bFile').hidden = !withButtons;
  $('#imgview').hidden = false;
}
$('#bShare').onclick = async () => {
  try { await navigator.share({ files: [new File([saveBlob], saveName, { type: 'image/png' })] }); }
  catch (e) { if (!e || e.name !== 'AbortError') toast('공유 창을 열 수 없어요 · 이미지를 길게 눌러 저장하세요'); }
};
$('#bFile').onclick = () => fileDownload(saveBlob, saveName);
$('#bSave').onclick = exportPNG;

/* ---------- Misc ---------- */
let tt = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800); }
window.addEventListener('keydown', e => {
  const a = document.activeElement;
  const typing = a && /INPUT|TEXTAREA/.test(a.tagName) && a.type !== 'range';
  if (e.key === 'Escape') { closeSheets(); return; }
  if (typing) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.code === 'Space' && $('#picker').hidden) { e.preventDefault(); randomize(); }
});
function refreshAll() { renderStops(); renderOpts(); renderPresets(); renderMoods(); draw(); }
$('#ncount').textContent = LIST.length;
setN(S.n);
refreshAll();
</script>
</body>
</html>
